services:
  db:
    image: postgres:16
    container_name: crossfit_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: crossfit
      POSTGRES_USER: crossfit_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: